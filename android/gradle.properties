org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin incremental compilation breaks when the project and the pub cache live
# on different Windows drives (project on D:, PUB_CACHE on C:). The compiler
# tries to relativize plugin sources against android/ and fails with
# "this and base files have different roots". Kotlin then falls back to a full
# recompile anyway, so we disable incremental mode explicitly: same output,
# without the stack traces and the wasted first attempt.
# Move PUB_CACHE onto the project drive and this line can go away.
kotlin.incremental=false
